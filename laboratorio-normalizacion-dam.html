(function(){
  var PROXY_BASE='/api/published/'+"6ab3baaf18cfd2854d2ec499"+'/proxy';

  function callPlugin(name,args){
    return (window.__nativeFetch||fetch)(PROXY_BASE+'/tools/execute',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:name,args:args})
    }).then(function(res){
      return res.json().then(function(data){
        if(!res.ok){
          var msg=(data.errors&&data.errors[0]&&data.errors[0].message)||'DB operation failed';
          throw new Error(msg);
        }
        return data.result||data;
      });
    });
  }

  function DbHandle(nameOrId,opts){
    this._nameOrId=nameOrId;
    this._opts=opts||{};
    this._dbId=null;
    this._permission='read';
    this._hasPending=false;
    this._pendingCount=0;
    this._pendingListeners=[];
    this._opened=false;
    this._liveInterval=null;
    this._lastVersion=null;
  }

  DbHandle.prototype._ensureOpen=function(){
    if(this._opened)return Promise.resolve();
    var self=this;
    // Resolve DB by name or ID — response is {success,result:{databases:[...]}}
    return callPlugin('dbList',{}).then(function(data){
      var r=data&&data.result?data.result:data;
      var dbs=r&&r.databases?r.databases:[];
      var match=dbs.find(function(db){
        return db.id===self._nameOrId||db.name===self._nameOrId;
      });
      if(!match)throw new Error('Database "'+self._nameOrId+'" not found');
      self._dbId=match.id;
      self._permission=match.permission||'read';
      self._opened=true;
      if(self._opts.live)self._startLive();
    });
  };

  DbHandle.prototype._startLive=function(){
    if(this._liveInterval)return;
    var self=this;
    this._liveInterval=setInterval(function(){
      if(!self._dbId)return;
      callPlugin('dbVersion',{dbId:self._dbId}).then(function(data){
        var r=data&&data.result?data.result:data;
        var v=r&&r.version;
        if(v!==undefined&&self._lastVersion!==null&&v!==self._lastVersion){
          self._pendingListeners.forEach(function(fn){try{fn(false);}catch(_){}});
        }
        self._lastVersion=v;
      }).catch(function(){});
    },5000);
  };

  DbHandle.prototype.query=function(sql,params){
    var self=this;
    return this._ensureOpen().then(function(){
      return callPlugin('dbQuery',{dbId:self._dbId,sql:sql,params:params||[]}).then(function(data){return data&&data.result?data.result:data});
    });
  };

  DbHandle.prototype.exec=function(sql,params){
    var self=this;
    return this._ensureOpen().then(function(){
      return callPlugin('dbExec',{dbId:self._dbId,sql:sql,params:params||[]}).then(function(data){return data&&data.result?data.result:data});
    });
  };

  DbHandle.prototype.insert=function(table,row){
    var self=this;
    return this._ensureOpen().then(function(){
      return callPlugin('dbInsert',{dbId:self._dbId,table:table,row:row}).then(function(data){return data&&data.result?data.result:data});
    });
  };

  DbHandle.prototype.bulkInsert=function(table,rows){
    var self=this;
    return this._ensureOpen().then(function(){
      return callPlugin('dbBulkInsert',{dbId:self._dbId,table:table,rows:rows}).then(function(data){return data&&data.result?data.result:data});
    });
  };

  DbHandle.prototype.refresh=function(){
    var self=this;
    return this._ensureOpen().then(function(){
      return callPlugin('dbVersion',{dbId:self._dbId}).then(function(data){return data&&data.result?data.result:data});
    });
  };

  DbHandle.prototype.stopLive=function(){
    if(this._liveInterval){
      clearInterval(this._liveInterval);
      this._liveInterval=null;
    }
  };

  DbHandle.prototype.onPendingChange=function(fn){
    this._pendingListeners.push(fn);
    var self=this;
    return function(){
      var idx=self._pendingListeners.indexOf(fn);
      if(idx>=0)self._pendingListeners.splice(idx,1);
    };
  };

  Object.defineProperty(DbHandle.prototype,'hasPending',{get:function(){return this._hasPending;}});
  Object.defineProperty(DbHandle.prototype,'pendingCount',{get:function(){return this._pendingCount;}});
  Object.defineProperty(DbHandle.prototype,'permission',{get:function(){return this._permission;}});

  window.AiKit=window.AiKit||{};
  window.AiKit.db=function(nameOrId,opts){return new DbHandle(nameOrId,opts);};
})();
